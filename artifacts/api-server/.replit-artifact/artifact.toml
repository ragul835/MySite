kind = "api"
previewPath = "/api/v1"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5001
name = "Spring Boot API"
paths = ["/api/v1"]

[services.development]
run = "mvn -f /home/runner/workspace/backend/pom.xml spring-boot:run -Dspring-boot.run.profiles=dev -Dspring-boot.run.jvmArguments=-Dserver.port=5001"

[services.production.build]
args = ["mvn", "-f", "/home/runner/workspace/backend/pom.xml", "clean", "package", "-DskipTests"]

[services.production.run]
args = ["java", "-jar", "/home/runner/workspace/backend/target/agency-backend-0.0.1-SNAPSHOT.jar", "--spring.profiles.active=prod", "--server.port=5001"]

[services.production.health.startup]
path = "/api/v1/services"
